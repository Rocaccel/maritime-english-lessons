site_name: Maritime English — Уроки
site_url: https://rocaccel.github.io/maritime-english-lessons/
docs_dir: docs
site_dir: site

repo_url: https://github.com/Rocaccel/maritime-english-lessons
edit_uri: blob/master/docs/

theme:
  name: readthedocs
  custom_dir: overrides
  locale: ru
  highlightjs: true

markdown_extensions:
  - tables
  - fenced_code

plugins:
  - search:
      lang: [en, ru]

nav:
  - Home: README.md
  - Unit 1 - Main Parts of a Vessel. Ship's Hull:
      - Unit-1 work text: Unit-1/unit-1-text.md
      - Main Parts of a Vessel. Ship's Hull: Unit-1/unit-1_part-1_main_parts_of_a_vessel_ships_hull.md
      - Figure - Main Parts of a Vessel. Ship's Hull: Unit-1/image1.md
      - Ship Equipment and Cargo Operations: Unit-1/unit-1_part-2_ship_equipment_and_cargo_operations.md
      - Figure - Ship Equipment and Cargo Operations: Unit-1/image2.md
  - Unit 2 - Types of Ships:
      - Unit-2 work text: Unit-2/unit-2-text.md
